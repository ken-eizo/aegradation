name: Portable CPU and Metal
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cmake -S . -B build/core -DGRADATION_CORE_ONLY=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/core --config Release --parallel 2
      - run: ctest --test-dir build/core -C Release --output-on-failure
  metal:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: xcrun --find metal
      - run: cmake -S . -B build/metal -DGRADATION_CORE_ONLY=ON -DGRADATION_TEST_METAL=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/metal --config Release --target gradation_metal_smoke --parallel 2
      - run: ctest --test-dir build/metal -C Release -R gradation_metal_smoke --output-on-failure
